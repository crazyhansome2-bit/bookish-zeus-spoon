<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}我的博客{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a6baf;
            --secondary-color: #3a5795;
            --accent-color: #f39c12;
            --text-color: #333;
            --light-gray: #f8f9fa;
            --medium-gray: #e9ecef;
            --dark-gray: #6c757d;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }
        
        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: var(--light-gray);
            color: var(--text-color);
        }
        
        .container {
            width: 85%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1.5em 0;
            margin-bottom: 30px;
            box-shadow: var(--box-shadow);
        }
        
        header h1 {
            margin: 0;
            padding: 0 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        nav {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 12px 0;
            margin-top: 10px;
            border-radius: var(--border-radius);
        }
        
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: var(--border-radius);
            transition: var(--transition);
            font-weight: 500;
        }
        
        nav a:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .content {
            background-color: white;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        
        .post {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--medium-gray);
            transition: var(--transition);
        }
        
        .post:hover {
            transform: translateY(-5px);
            box-shadow: var(--box-shadow);
            padding: 20px;
            margin: 0 -20px 40px -20px;
            border-radius: var(--border-radius);
        }
        
        .post:last-child {
            border-bottom: none;
        }
        
        .post h2 {
            margin-top: 0;
            color: var(--primary-color);
        }
        
        .post h2 a {
            color: var(--primary-color);
            text-decoration: none;
            transition: var(--transition);
        }
        
        .post h2 a:hover {
            color: var(--accent-color);
        }
        
        .post-meta {
            color: var(--dark-gray);
            font-size: 0.9em;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .post-meta span, .post-meta a {
            margin-right: 15px;
        }
        
        .post-meta a {
            color: var(--primary-color);
            text-decoration: none;
            transition: var(--transition);
        }
        
        .post-meta a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }
        
        .post-content {
            margin-bottom: 20px;
            line-height: 1.8;
        }
        
        .read-more {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 8px 15px;
            border-radius: var(--border-radius);
            text-decoration: none;
            transition: var(--transition);
        }
        
        .read-more:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
        }
        
        .pagination {
            margin-top: 30px;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        
        .pagination a, .pagination .current {
            display: inline-block;
            padding: 8px 15px;
            border-radius: var(--border-radius);
            transition: var(--transition);
        }
        
        .pagination a {
            background-color: white;
            color: var(--primary-color);
            text-decoration: none;
            border: 1px solid var(--medium-gray);
        }
        
        .pagination a:hover {
            background-color: var(--medium-gray);
            transform: translateY(-2px);
        }
        
        .pagination .current {
            background-color: var(--primary-color);
            color: white;
            border: 1px solid var(--primary-color);
        }
        
        footer {
            text-align: center;
            padding: 30px;
            margin-top: 30px;
            color: var(--dark-gray);
            font-size: 0.9em;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>我的博客</h1>
            <nav>
                <a href="{% url 'blog:post_list' %}">首页</a>
                <a href="{% url 'blog:about' %}">关于</a>
                <a href="{% url 'blog:contact' %}">联系</a>
            </nav>
        </div>
    </header>
    
    <div class="container">
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
    
    <footer class="container">
        <p>&copy; 2025 我的Django博客 - 学生作业项目</p>
    </footer>
</body>
</html>
